# Emplazamientos candidatos para observación astronómica.
#
# Las coordenadas con valor null están pendientes de verificación de campo;
# analyze.py debe rechazar (o avisar) sobre cualquier sitio sin lat/lon.
# altitude_m es informativa, no se usa en el cálculo de crepúsculos ni en
# la selección de celda de rejilla (ERA5 es un modelo de superficie a 0,25°,
# no resuelve la orografía fina).

